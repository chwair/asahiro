[package]
name = "asahiro-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "asahiro_core"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "asahiro-cli"
path = "src/bin/cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "zstd"] }
md-5 = "0.10"
hex = "0.4"
libc = "0.2"
sha2 = "0.10"
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
